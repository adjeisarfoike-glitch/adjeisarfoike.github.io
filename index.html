<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isaac Sarfo Adjei — The Research Desk</title>
<meta name="description" content="Isaac Sarfo Adjei: communication research, design and digital media. Thesis, essays, illustration and design, laid out on a research desk.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,500&amp;family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&amp;family=JetBrains+Mono:wght@400;600;800&amp;family=Caveat:wght@500;700&amp;family=UnifrakturMaguntia&amp;family=Archivo:wght@400;600;800;900&amp;display=swap">
<style>
body{margin:0;background:#1E130C}
html{scroll-behavior:smooth}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #E2C677;outline-offset:3px}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:30;height:52px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;background:linear-gradient(180deg,rgba(18,11,6,.92),rgba(18,11,6,.55));color:#EDE7DA;font-family:Newsreader,serif;border-bottom:1px solid rgba(237,231,218,.12)}
.brand{font-family:'Bodoni Moda',serif;font-size:18px;font-weight:500;text-decoration:none;min-height:44px;display:flex;align-items:center;white-space:nowrap}
.chap{font-style:italic;font-size:17px;white-space:nowrap;color:#D0C9BB}
.dots{display:flex;gap:6px;align-items:center}
.dots a{position:relative;display:flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;border-radius:50%;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:12px}
.tip{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#EDE7DA;color:#1E130C;padding:4px 10px;border-radius:4px;font-family:Newsreader,serif;font-style:italic;font-size:15px;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.dots a:hover .tip,.dots a:focus-visible .tip{opacity:1}
.acts{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border:1px solid rgba(237,231,218,.5);background:transparent;color:#EDE7DA;font-family:Newsreader,serif;font-style:italic;font-size:16px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.solid{background:#EDE7DA;color:#1E130C;border-color:#EDE7DA}
@media (max-width: 1150px){.chap{display:none}}
@media (max-width: 820px){.dots,.hide-sm{display:none}.top{padding:0 10px;gap:6px}.brand{font-size:16px}.btn{padding:0 9px;font-size:15px}}

/* ---------- the scroll tour ---------- */
.tour{position:relative;height:766vh}
.stage{position:-webkit-sticky;position:sticky;top:0;height:100vh;overflow:hidden;background:#1E130C;touch-action:pan-y}
.world{position:absolute;left:0;top:0;width:2800px;height:1800px;transform-origin:0 0;will-change:transform;
  background-color:#6A4630;
  background-image:
    radial-gradient(ellipse 46% 40% at 66% 34%, rgba(255,226,170,.22), transparent 70%),
    radial-gradient(ellipse 60px 22px at 23% 62%, rgba(40,22,10,.55), rgba(40,22,10,.2) 55%, transparent 72%),
    radial-gradient(ellipse 44px 16px at 81% 18%, rgba(40,22,10,.5), rgba(40,22,10,.18) 55%, transparent 72%),
    radial-gradient(rgba(0,0,0,.05) 1px, transparent 1.5px),
    repeating-linear-gradient(180deg, transparent 0 448px, rgba(0,0,0,.38) 448px 450px, rgba(255,255,255,.05) 450px 451px),
    repeating-linear-gradient(178.6deg, rgba(0,0,0,.07) 0 2px, transparent 2px 17px, rgba(255,255,255,.045) 17px 19px, transparent 19px 37px),
    repeating-linear-gradient(181.2deg, rgba(0,0,0,.05) 0 1px, transparent 1px 7px),
    linear-gradient(90deg, #5A3A26, #74503A 22%, #684531 45%, #7B573F 70%, #5E3D29);
  background-size:100% 100%, 100% 100%, 100% 100%, 5px 5px, 100% 100%, 100% 100%, 100% 100%, 100% 100%}
.lamp{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55))}
.obj{position:absolute;box-sizing:border-box}
/* one light source, top-right: every object casts its shadow down and to the left */
.lift{box-shadow:-16px 24px 34px rgba(0,0,0,.42),-3px 5px 8px rgba(0,0,0,.25)}
.paper{background:#FBF8F1;box-shadow:-16px 24px 34px rgba(0,0,0,.4),-3px 5px 8px rgba(0,0,0,.22)}
.hot{position:absolute;inset:-14px;border-radius:20px;z-index:20;cursor:pointer;transition:box-shadow .25s, background-color .25s}
.hot:hover{box-shadow:0 0 0 6px rgba(255,214,150,.65),0 0 80px rgba(255,214,150,.45);background-color:rgba(255,214,150,.05)}

/* scroll-driven pieces: --a is the object's own progress (0→1), --t a threshold within it */
.appear{--v:clamp(0, (var(--a) - var(--t, 0)) * 6, 1);opacity:var(--v);transform:translateY(calc((1 - var(--v)) * 14px))}
.draw{transform-origin:0 50%;transform:scaleX(clamp(0, (var(--a) - var(--t, 0)) * 5, 1))}
.unfold{transform-origin:50% 0;transform:perspective(1600px) rotateX(calc((1 - var(--a)) * -88deg))}
.foldshade{opacity:calc(1 - var(--a))}
.tab{transform:translateX(calc((1 - clamp(0, (var(--a) - var(--t, 0)) * 4, 1)) * -70px))}
.feed{transform:translateY(calc(var(--a) * -1566px))}
.slide{transform:translateY(calc((1 - var(--a)) * 150px))}
.unroll{clip-path:inset(0 calc((1 - var(--a)) * 92%) 0 0)}
.roll{left:calc((0.08 + var(--a) * 0.92) * 100% - 18px);opacity:calc((1 - var(--a)) * 5)}
.fan{transform:translate(calc(var(--a) * var(--fx) * 1px), calc(var(--a) * var(--fy) * 1px)) rotate(calc(var(--a) * var(--fr) * 1deg))}
.cover{transform-origin:0 50%;transform:perspective(2200px) rotateY(calc(var(--open) * -158deg));-webkit-backface-visibility:hidden;backface-visibility:hidden}
.stampin{--v:clamp(0, (var(--a) - 0.75) * 5, 1);opacity:var(--v);transform:scale(calc(2 - var(--v))) rotate(-8deg)}
.foil{background:linear-gradient(110deg,#B8923F 20%,#F6E2A0 40%,#B8923F 60%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 7s linear infinite}
@keyframes foil{to{background-position:-220% 0}}
.typing i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:#9AA1AE;animation:dotb 1.2s ease-in-out infinite}
@keyframes dotb{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.steam{position:absolute;width:60px;height:120px;border-radius:50%;background:radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.35), transparent 65%);filter:blur(10px);animation:steam 5s ease-in-out infinite}
@keyframes steam{0%{transform:translate(0,10px) scale(.8);opacity:0}40%{opacity:.8}100%{transform:translate(-30px,-110px) scale(1.4);opacity:0}}

/* ---------- explainer placards ---------- */
.card{position:absolute;width:372px;box-sizing:border-box;padding:0;color:#1D1A16;border-radius:3px;
  background-color:#FBF8F1;background-image:radial-gradient(rgba(120,90,50,.06) 1px, transparent 1.4px),linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 40%);background-size:5px 5px,100% 100%;
  box-shadow:-16px 24px 44px rgba(0,0,0,.52),0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(29,26,22,.08);
  font-family:Newsreader, Georgia, serif;font-size:16px;line-height:1.58;z-index:12;scrollbar-width:thin}
.card-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 20px;background:#1D1A16;color:#EDE7DA}
.num{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1.5px solid #E3A78D;font-family:'Bodoni Moda',serif;font-size:16px;color:#F3D7C8}
.kicker{margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.4;letter-spacing:.14em;text-transform:uppercase;color:#E3C9B4}
.card-body{padding:16px 22px 6px}
.h{margin:0;font-family:'Bodoni Moda',serif;font-weight:500;line-height:1.06;letter-spacing:-0.015em}
.card p{margin:10px 0 0}
.look{display:flex;gap:10px;align-items:flex-start;margin:12px 0 2px !important;padding:9px 12px;border-radius:3px;background:rgba(176,58,34,.08);font-style:italic;font-size:15px;line-height:1.4;color:#6E2A18}
.look svg{flex:0 0 auto;width:16px;height:16px;margin-top:2px}
.meta{font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#6B6458}
.chip{display:inline-block;padding:2px 8px;margin:4px 4px 0 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;border:1.5px solid #1D1A16}
.ctas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cta{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;background:#1D1A16;color:#FBF8F1;border:1.5px solid #1D1A16;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
.cta:hover{background:#B03A22;border-color:#B03A22}
.cta.ghost{background:transparent;color:#1D1A16}
.cta.ghost:hover{background:#1D1A16;color:#FBF8F1;border-color:#1D1A16}
.prog{display:flex;gap:4px;margin-top:16px}
.prog i{flex:1;height:4px;border-radius:2px;background:rgba(29,26,22,.14)}
.prog i.done{background:rgba(29,26,22,.45)}
.prog i.now{background:#B03A22}
/* exercise-book page: pale blue rules every 25px, a red margin, text on the lines */
.card-body{padding:0;position:relative}
.page-top{padding:16px 20px 11px 50px;border-bottom:1.5px solid rgba(196,72,64,.55);
  background:linear-gradient(90deg,transparent 34px,rgba(196,72,64,.5) 34px 35.5px,transparent 35.5px 38px,rgba(196,72,64,.32) 38px 39px,transparent 39px)}
.ruled{padding:0 20px 0 50px;line-height:25px;
  background:
    linear-gradient(90deg,transparent 34px,rgba(196,72,64,.5) 34px 35.5px,transparent 35.5px 38px,rgba(196,72,64,.32) 38px 39px,transparent 39px),
    repeating-linear-gradient(180deg,transparent 0 24px,rgba(84,128,186,.30) 24px 25px)}
.ruled > *{margin:25px 0 0 !important}
.ruled > *:first-child{margin-top:0 !important}
.ruled p,.ruled li,.ruled .meta,.ruled ul{line-height:25px !important}
.ruled ul{padding-left:18px}
.ruled li{margin:0 !important}
.card .ruled .look{margin:0 !important;padding:0 10px;border-radius:0;font-size:15px;line-height:25px;background:rgba(176,58,34,.07)}
.card .ruled .look svg{margin-top:4.5px}
.ruled .ctas{gap:0 8px;align-content:flex-start}
.ruled .cta{min-height:0;height:42px;margin-bottom:8px;line-height:1}
.ruled .prog{height:25px;align-items:center;gap:4px}
.ruled .cardnav{min-height:50px;margin-top:0 !important;line-height:25px}
.ruled .cardnav a{min-height:50px}
.ruled > div[style*="border-top"]{border-top:0 !important;padding-top:0 !important}
.ruled button[aria-pressed]{min-height:33px !important;margin-bottom:-8px}
.ruled > div p{margin-top:0 !important}
.ruled > div > button{margin-top:0 !important;min-height:0 !important;height:42px;margin-bottom:8px}
.ruled > div > div[role="group"]{margin-top:0 !important;height:25px;align-items:flex-start}
/* the page scrolls inside its comb binding */
.card-scroll{max-height:calc((100vh - 96px) / var(--z, 1));overflow:auto;border-radius:3px;scrollbar-width:thin}
.comb{position:absolute;top:10px;bottom:10px;left:-24px;width:34px;height:calc(100% - 20px);overflow:visible;z-index:3;transform:scaleX(-1);filter:drop-shadow(3px 4px 3px rgba(0,0,0,.45))}
.card .card-head{padding-left:28px}

/* handwriting: black for titles, blue ballpoint for the rest, red pen for the notes */
.card .page-top .h{font-family:Caveat, 'Bradley Hand', cursive !important;font-weight:700;font-size:34px !important;line-height:1 !important;letter-spacing:0;color:#1D1A16}
.card .ruled{font-family:Caveat, 'Bradley Hand', cursive;color:#22336B}
.card .ruled p,.card .ruled li,.card .ruled ul{font-size:21px !important;font-weight:500}
.card .ruled .meta{font-family:Caveat, cursive;font-style:normal;font-size:20px !important;color:#4E5A7A}
.card .ruled i{font-style:normal;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.card .ruled b{font-weight:700}
.card .ruled a{color:#1C2E66;text-decoration:underline;text-decoration-thickness:1.2px;text-underline-offset:3px}
.card .ruled .look{font-family:Caveat, cursive;font-style:normal;font-size:20px;color:#B03A22}
.card .ruled .cta{font-family:Caveat, cursive;font-size:21px;font-weight:700;letter-spacing:0;text-transform:none;text-decoration:none;padding:0 14px}
.card .ruled .cta:not(.ghost){color:#FBF8F1}
.card .ruled .cta.ghost{color:#1C2E66;border-color:#1C2E66}
.card .ruled .cta.ghost:hover{color:#FBF8F1}
.card .ruled .cardnav{font-family:Caveat, cursive;font-style:normal;font-size:21px}
.card .ruled .cardnav a{text-decoration:none}
.card .ruled button[aria-pressed]{font-family:Caveat, cursive !important;font-size:18px !important}
.card .ruled > div p{font-size:18px !important}
/* cite this site: each part on its own line, a blank line between */
.card .ruled .cite{margin-top:50px !important}
.card .ruled .cite .meta{margin:0 !important;line-height:25px;font-size:22px !important;font-weight:700;color:#1D1A16}
.card .ruled .cite-tabs{display:flex;gap:12px;margin-top:25px;height:50px;align-items:flex-start}
.card .ruled .cite-tabs button{height:42px;min-height:0 !important;margin:0 !important;padding:0 18px !important;font-size:20px !important}
.card .ruled .cite-text{margin:25px 0 0 !important;padding-left:28px;text-indent:-28px;font-size:20px !important;line-height:25px !important;overflow-wrap:anywhere}
.card .ruled .cite-copy{margin-top:25px;background:#B03A22;border-color:#B03A22}
.card .ruled .cite-copy:hover{background:#1D1A16;border-color:#1D1A16}
.cardnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-family:Newsreader,serif;font-style:italic;font-size:15px}
.cardnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;text-decoration:none;border-bottom:1px solid transparent}
.cardnav a:hover{color:#B03A22}
.cardnav a:last-child{margin-left:auto;font-weight:600}
.collapse{display:none;position:absolute;top:13px;right:12px;z-index:3;min-height:36px;min-width:36px;padding:0 10px;border:1px solid rgba(237,231,218,.45);background:transparent;color:#EDE7DA;font-family:Newsreader,serif;font-size:14px;cursor:pointer}
.leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;overflow:visible}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:#EDE7DA;font-family:Newsreader,serif;font-style:italic;font-size:18px;z-index:11;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.bob{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
@media (max-width: 820px){
  .card{left:22px !important;right:10px !important;top:auto !important;bottom:10px !important;width:auto;padding:0;transform:translateY(var(--dy, 0px)) !important}
  .card-scroll{max-height:48vh}
  .comb{left:-18px}
  .card-head{padding-right:84px}
  .collapse{display:inline-flex;align-items:center}
  .card.collapsed .card-scroll{max-height:62px;overflow:hidden}
  .leader,.cue{display:none}
}

/* ---------- read as a page: the original site ---------- */
.orig{
  --oInk:#0B1712;
  --oInk-raised:#122019;
  --bone:#EDE7DA;
  --bone-dim:#D0C9BB;
  --emerald:#1F5240;
  --peach:#E3A78D;
  --brass:#B4924F;
  --rule-dark:rgba(237,231,218,.2);
  --rule-light:rgba(11,23,18,.22);

  --display:'Bodoni Moda',Didot,Georgia,serif;
  --text:'Newsreader',Georgia,serif;

  --gut:clamp(1.25rem,4.5vw,5rem);
  --stack:clamp(5rem,11vw,10rem);
}

.orig *,.orig *::before,.orig *::after{margin:0;padding:0;box-sizing:border-box}

.orig{min-height:100vh;
  background:var(--oInk);
  color:var(--bone);
  font-family:var(--text);
  font-size:1.125rem;
  font-weight:400;
  text-rendering:optimizeLegibility;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.orig img{display:block;max-width:100%}
.orig a{color:inherit}
.orig :focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.o-wrap{max-width:1500px;margin:0 auto;padding-inline:var(--gut)}

/* ─── Running head ────────────────────────────────── */
.o-nav{
  position:fixed;inset:0 0 auto 0;z-index:900;
  display:flex;align-items:baseline;justify-content:space-between;gap:2rem;
  padding:1.15rem var(--gut);
  border-bottom:1px solid transparent;
  transition:background .5s ease,border-color .5s ease,opacity .4s ease;
  opacity:0;pointer-events:none;
}
.o-nav.o-settled{
  opacity:1;pointer-events:auto;
  background:rgba(11,23,18,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom-color:var(--rule-dark);
}
.o-nav__name{font-family:var(--display);font-size:1.05rem;font-weight:500;text-decoration:none;white-space:nowrap}
.o-nav__links{display:flex;align-items:baseline;gap:clamp(.9rem,2.4vw,2.1rem);list-style:none;font-size:.95rem;font-style:italic}
.o-nav__links a{text-decoration:none;color:var(--bone-dim);border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.o-nav__links a:hover{color:var(--bone);border-bottom-color:var(--peach)}

/* ─── Cover ───────────────────────────────────────── */
.o-cover{
  position:relative;min-height:100svh;
  display:grid;grid-template-rows:auto 1fr auto;
  overflow:hidden;
  padding:clamp(1.5rem,4vh,3rem) var(--gut) clamp(2rem,5vh,3.5rem);
}
.o-cover__art{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 36%;
  opacity:0;transform:scale(1.05);
  animation:oPlateIn 2.2s cubic-bezier(.22,.61,.36,1) .15s forwards;
}
.o-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(11,23,18,.95) 0%,rgba(11,23,18,.6) 34%,rgba(11,23,18,.1) 58%,rgba(11,23,18,.72) 100%);
}
.o-cover > *{position:relative;z-index:2}

.o-masthead{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(1.9rem,8.4vw,7.5rem);
  line-height:.95;
  letter-spacing:.005em;
  text-align:center;
  white-space:nowrap;
  opacity:0;animation:oLabelUp 1.2s ease .75s forwards;
}
.o-cover__issue{
  display:flex;flex-wrap:wrap;gap:.3rem 1.6rem;justify-content:center;
  margin-top:.9rem;
  font-size:.9rem;font-style:italic;color:var(--bone-dim);
  opacity:0;animation:oLabelUp 1.2s ease .95s forwards;
}

.o-coverlines{align-self:end;max-width:min(780px,92%)}
.o-cover__kicker{
  font-size:.9rem;font-style:italic;color:var(--peach);
  margin-bottom:1.1rem;
  opacity:0;animation:oLabelUp 1.1s ease 1.1s forwards;
}
.o-cover__line{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.3rem,6.4vw,5.4rem);
  line-height:1.02;letter-spacing:-.015em;
  color:transparent;
  -webkit-text-stroke:1px rgba(237,231,218,.75);
  opacity:0;
  animation:oLabelUp 1.1s ease 1.28s forwards, oInk 1.6s cubic-bezier(.4,0,.2,1) 2.2s forwards;
}
.o-cover__credit{
  margin-top:1.4rem;display:flex;flex-wrap:wrap;gap:.3rem 1.4rem;align-items:baseline;
  font-size:.94rem;color:var(--bone-dim);
  opacity:0;animation:oLabelUp 1.1s ease 1.44s forwards;
}
.o-cover__credit em{font-family:var(--display);font-style:italic;color:var(--bone);font-size:1.05rem}
.o-cover__note{
  margin-top:1.1rem;max-width:46ch;color:var(--bone-dim);font-style:italic;
  opacity:0;animation:oLabelUp 1.1s ease 1.58s forwards;
}
.o-cover__foot{
  display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;
  margin-top:2.5rem;padding-top:.9rem;
  border-top:1px solid var(--rule-dark);
  font-size:.9rem;font-style:italic;color:var(--bone-dim);
  opacity:0;animation:oLabelUp 1.1s ease 1.72s forwards;
}

@keyframes oPlateIn{to{opacity:1;transform:scale(1)}}
@keyframes oLabelUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes oInk{to{color:var(--bone);-webkit-text-stroke-color:transparent}}

/* ─── Contents ────────────────────────────────────── */
.o-contents{background:var(--bone);color:var(--oInk);padding-block:var(--stack)}
.o-contents__grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.75fr);gap:clamp(2rem,6vw,6rem)}
.o-contents h2{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;letter-spacing:-.02em;
  margin-bottom:2.2rem;
}
.o-toc{border-top:2px solid var(--oInk)}
.o-toc a{
  display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;
  align-items:baseline;gap:.9rem;
  padding:1.15rem 0;border-bottom:1px solid var(--rule-light);
  text-decoration:none;
  transition:padding-inline-start .4s ease,color .3s ease;
}
.o-toc a:hover,.o-toc a:focus-visible{padding-inline-start:.7rem;color:#7C4A2E}
.o-toc__no{font-family:var(--text);font-size:.95rem;font-style:italic;color:#6B665C}
.o-toc__ttl{font-family:var(--display);font-weight:500;font-size:clamp(1.15rem,2.1vw,1.55rem);line-height:1.2}
.o-toc__sub{display:block;font-family:var(--text);font-size:.9rem;font-style:italic;color:#55504A;margin-top:.15rem}
.o-toc__pg{font-family:var(--text);font-size:.95rem;font-style:italic;color:#6B665C}
.o-contents__aside p{font-style:italic;color:#383833;max-width:34ch}
.o-contents__aside .o-rule{height:1px;background:var(--rule-light);margin:1.4rem 0}

/* ─── Feature furniture ───────────────────────────── */
.o-feature{padding-block:var(--stack)}
.o-feature--bone{background:var(--bone);color:var(--oInk)}
.o-feature--emerald{background:var(--emerald);color:var(--bone)}

.o-runhead{
  display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;
  padding-bottom:.55rem;margin-bottom:clamp(2rem,4vw,3.2rem);
  border-bottom:1px solid var(--rule-dark);
  box-shadow:0 3px 0 -2px var(--rule-dark);
  font-size:.9rem;font-style:italic;color:var(--bone-dim);
}
.o-feature--bone .o-runhead{border-bottom-color:var(--rule-light);box-shadow:0 3px 0 -2px var(--rule-light);color:#55504A}
.o-feature--emerald .o-runhead{color:rgba(237,231,218,.7)}

.o-opener{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(1.5rem,4vw,4.5rem);align-items:end;margin-bottom:clamp(2.6rem,5vw,4.5rem)}
.o-opener h2{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5.4vw,4.2rem);line-height:1.02;letter-spacing:-.02em}
.o-standfirst{font-size:1.16rem;line-height:1.6;max-width:48ch;color:var(--bone-dim)}
.o-feature--bone .o-standfirst{color:#383833}
.o-standfirst a{color:var(--peach)}
.o-feature--bone .o-standfirst a{color:#9A5B3C}

/* ─── Plates ──────────────────────────────────────── */
.o-plates{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(2rem,4vw,3.6rem) clamp(1.4rem,2.6vw,2.6rem)}
.o-plates--advocacy{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

.o-plate{display:block;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.o-plate__frame{position:relative;overflow:hidden;background:var(--oInk-raised);aspect-ratio:4/5}
.o-plates--advocacy .o-plate__frame{aspect-ratio:1/1}
.o-plate--lead .o-plate__frame{aspect-ratio:16/9}
.o-plate--lead{grid-column:1/-1}
.o-plate__frame img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(.9) brightness(.93);
  transition:transform .85s cubic-bezier(.22,.61,.36,1),filter .6s ease;
}
.o-plate:hover .o-plate__frame img,.o-plate:focus-visible .o-plate__frame img{transform:scale(1.03);filter:saturate(1) brightness(1)}

.o-plate__cap{display:grid;gap:.2rem;padding-top:.85rem}
.o-plate__cap h3{font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.24}
.o-plate__cap span{font-size:.93rem;font-style:italic;color:var(--bone-dim)}
.o-plate__cap .o-fig{color:var(--brass);font-style:italic}
.o-feature--bone .o-plate__cap span{color:#55504A}
.o-feature--bone .o-plate__cap .o-fig{color:#8A6A32}

/* ─── Research ────────────────────────────────────── */
.o-thesis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(1.5rem,4vw,4.5rem);padding:2.2rem 0 2.6rem;border-top:2px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark)}
.o-thesis h3{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3.2vw,2.6rem);line-height:1.1;letter-spacing:-.01em;margin-top:.7rem;max-width:18ch}
.o-thesis__body p{color:var(--bone-dim);margin-bottom:1.1rem;max-width:58ch;line-height:1.72}
.o-thesis__meta{font-size:.95rem;color:var(--brass)!important;font-style:italic}
.o-subhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:clamp(3.5rem,7vw,6rem) 0 1.2rem;scroll-margin-top:5rem}
.o-subhead h3{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,3.6vw,2.8rem);line-height:1.05}
.o-subhead p{font-style:italic;color:var(--bone-dim);font-size:.95rem}
.o-subhead a{color:var(--peach)}
@media (max-width:860px){
  .o-thesis{grid-template-columns:1fr;gap:1.2rem}
}

/* ─── Essays ──────────────────────────────────────── */
.o-essays{border-top:2px solid var(--rule-dark)}
.o-essay{
  display:grid;grid-template-columns:4.5rem minmax(0,1.1fr) minmax(0,.95fr);
  gap:.4rem clamp(1.2rem,3vw,3rem);align-items:baseline;
  padding:1.9rem 0;border-bottom:1px solid var(--rule-dark);
  text-decoration:none;
  transition:padding-inline-start .45s cubic-bezier(.22,.61,.36,1),background .45s ease;
}
.o-essay:hover,.o-essay:focus-visible{padding-inline-start:1.2rem;background:linear-gradient(90deg,rgba(227,167,141,.09),transparent 68%)}
.o-essay__no{font-family:var(--text);font-style:italic;font-size:.95rem;color:var(--brass)}
.o-essay h3{font-family:var(--display);font-weight:500;font-size:clamp(1.25rem,2.1vw,1.7rem);line-height:1.25}
.o-essay p{font-style:italic;color:var(--bone-dim);font-size:1.04rem;line-height:1.6;max-width:46ch}

/* ─── Profile ─────────────────────────────────────── */
.o-profile{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.3fr);gap:clamp(2rem,6vw,5.5rem);align-items:start}
.o-profile__portrait{position:relative}
.o-profile__portrait img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:saturate(.94)}
.o-profile__portrait figcaption{margin-top:.7rem;font-size:.92rem;font-style:italic;color:#55504A}
.o-profile h2{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4vw,3rem);line-height:1.06;letter-spacing:-.015em;margin-bottom:1.5rem;max-width:18ch}

.o-cols{column-count:2;column-gap:clamp(1.4rem,3vw,2.8rem);text-align:left;hyphens:manual;color:#2C2C28}
.o-cols p{margin-bottom:1rem}
.o-cols p:first-of-type::first-letter{
  font-family:var(--display);font-weight:400;
  float:left;font-size:4.3em;line-height:.8;
  padding-right:.08em;margin-top:.04em;
  color:var(--oInk);
}
.o-pullquote{
  margin:2rem 0;padding:1.3rem 0;
  border-top:2px solid var(--oInk);border-bottom:1px solid var(--rule-light);
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:clamp(1.3rem,2.6vw,1.9rem);line-height:1.28;
  color:var(--oInk);max-width:26ch;
}
.o-profile__actions{display:flex;flex-wrap:wrap;gap:.85rem;margin-top:2rem}
.o-btn{
  display:inline-block;padding:.9rem 2rem;font-family:var(--text);
  font-size:.95rem;font-style:italic;text-decoration:none;
  border:1px solid var(--oInk);background:var(--oInk);color:var(--bone);
  cursor:pointer;transition:background .3s,color .3s;
}
.o-btn:hover{background:transparent;color:var(--oInk)}
.o-btn--quiet{background:transparent;color:var(--oInk)}
.o-btn--quiet:hover{background:var(--oInk);color:var(--bone)}

/* ─── Colophon ────────────────────────────────────── */
.o-colophon{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,5vw,5rem);align-items:end}
.o-colophon h2{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,5.2vw,4.2rem);line-height:1.02;letter-spacing:-.018em;max-width:12ch}
.o-colophon > div > p{color:rgba(237,231,218,.9);max-width:42ch;margin-top:1.2rem;font-style:italic}
.o-clist{border-top:2px solid rgba(237,231,218,.3)}
.o-clist a{
  display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;
  padding:1.05rem 0;border-bottom:1px solid rgba(237,231,218,.28);
  text-decoration:none;
  transition:padding-inline-start .4s ease,color .3s ease;
}
.o-clist a:hover,.o-clist a:focus-visible{padding-inline-start:.8rem;color:var(--peach)}
.o-clist span:last-child{font-size:.92rem;font-style:italic;color:rgba(237,231,218,.78)}

.orig footer{
  padding:2.2rem var(--gut);display:flex;flex-wrap:wrap;gap:.5rem 2rem;justify-content:space-between;
  font-size:.9rem;font-style:italic;color:var(--bone-dim);border-top:1px solid var(--rule-dark);
}

/* ─── Lightbox ────────────────────────────────────── */
.o-viewer{position:fixed;inset:0;z-index:2000;display:none;background:rgba(6,13,10,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:clamp(1rem,4vw,3.5rem)}
.o-viewer.o-open{display:grid;grid-template-rows:1fr auto;gap:1.5rem}
.o-viewer__stage{display:flex;align-items:center;justify-content:center;min-height:0}
.o-viewer__stage img{max-width:100%;max-height:100%;object-fit:contain;animation:oPlateIn .5s ease}
.o-viewer__cap{display:flex;flex-wrap:wrap;gap:.4rem 2rem;align-items:baseline;justify-content:space-between;border-top:1px solid var(--rule-dark);padding-top:1.1rem}
.o-viewer__cap h3{font-family:var(--display);font-weight:500;font-size:1.35rem}
.o-viewer__cap p{color:var(--bone-dim);font-style:italic;font-size:.96rem;max-width:56ch}
.o-viewer__ctrl{position:absolute;background:transparent;border:1px solid var(--rule-dark);color:var(--bone);width:46px;height:46px;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;transition:background .3s,border-color .3s}
.o-viewer__ctrl:hover{background:rgba(237,231,218,.1);border-color:var(--peach)}
.o-viewer__close{top:clamp(1rem,3vw,2rem);right:clamp(1rem,3vw,2rem)}
.o-viewer__prev{left:clamp(.5rem,2vw,1.5rem);top:50%;transform:translateY(-50%)}
.o-viewer__next{right:clamp(.5rem,2vw,1.5rem);top:50%;transform:translateY(-50%)}

/* ─── Résumé ──────────────────────────────────────── */
.o-paper{position:fixed;inset:0;z-index:2100;display:none;place-items:center;background:rgba(6,13,10,.97);padding:clamp(1rem,3vw,2.5rem)}
.o-paper.o-open{display:grid}
.o-paper__sheet{width:min(920px,100%);height:min(88vh,100%);background:var(--bone);display:grid;grid-template-rows:auto 1fr auto}
.o-paper__bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem;background:var(--oInk);color:var(--bone)}
.o-paper__bar h3{font-family:var(--display);font-weight:500;font-size:1.1rem}
.o-paper__bar button{background:none;border:0;color:var(--bone);font-size:1.4rem;cursor:pointer;line-height:1;width:34px;height:34px}
.o-paper iframe{width:100%;height:100%;border:0}
.o-paper__foot{padding:.85rem 1.4rem;display:flex;justify-content:flex-end;border-top:1px solid var(--rule-light)}

/* ─── Responsive ──────────────────────────────────── */
@media (max-width:900px){
  .o-masthead{white-space:normal;font-size:clamp(1.7rem,9vw,3rem)}
  .o-contents__grid{grid-template-columns:1fr;gap:2.4rem}
  .o-opener{grid-template-columns:1fr;align-items:start;gap:1.1rem}
  .o-profile{grid-template-columns:1fr;gap:2.4rem}
  .o-profile__portrait{max-width:400px}
  .o-cols{column-count:1;text-align:left;hyphens:none}
  .o-pullquote{max-width:none}
  .o-essay{grid-template-columns:3rem 1fr;row-gap:.55rem}
  .o-essay p{grid-column:2}
  .o-colophon{grid-template-columns:1fr;gap:2.4rem}
}
@media (max-width:560px){
  .o-plates,.o-plates--advocacy{grid-template-columns:1fr}
  .o-plate--lead .o-plate__frame{aspect-ratio:4/3}
  .o-nav__links{gap:.9rem;font-size:.88rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0}
  .o-nav{gap:1rem}
  .o-toc a{grid-template-columns:2rem 1fr auto;gap:.6rem}
  .o-btn{width:100%;text-align:center}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .orig *,.orig *::before,.orig *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .o-cover__art,.o-masthead,.o-cover__issue,.o-cover__kicker,.o-cover__line,.o-cover__credit,.o-cover__note,.o-cover__foot{opacity:1;transform:none}
  .o-cover__line{color:var(--bone);-webkit-text-stroke-color:transparent}
}

.o-plate__frame img,.o-profile__portrait img,.o-cover__art{color:transparent}
.o-ph{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;font-family:var(--display);font-style:italic;color:#8C8577;background:repeating-linear-gradient(135deg,rgba(237,231,218,.04) 0 2px,transparent 2px 12px),var(--ink-raised)}
.o-plate__frame img{position:relative;z-index:1}
.o-profile__portrait{background:#D9D2C4}.o-profile__portrait .o-ph{color:#6B655A;background:repeating-linear-gradient(135deg,rgba(11,23,18,.05) 0 2px,transparent 2px 12px),#D9D2C4;aspect-ratio:4/5;position:relative;inset:auto}
.o-nav__back{background:none;border:1px solid var(--rule-dark);color:var(--bone);font:inherit;font-style:italic;font-size:.88rem;padding:.25rem .8rem;cursor:pointer;min-height:36px}
.o-nav__back:hover{border-color:var(--peach)}
.o-nav.o-settled .o-nav__back{display:inline-block}
.o-backfloat{position:fixed;top:14px;right:var(--gut);z-index:950}
.o-nav.o-settled ~ .o-backfloat{display:none}

@media (prefers-reduced-motion: reduce){.foil,.bob,.typing i,.steam,.ping{animation:none}}
.still .foil,.still .bob,.still .typing i,.still .steam,.still .ping{animation:none}
</style>

  <!-- ── I. Thesis and essays ───────────────────────── -->
  <section class="o-feature" id="research">
    <div class="o-wrap">
      <div class="o-runhead"><span>Research I</span><span>Thesis and essays</span></div>
      <div class="o-opener">
        <h2>Thesis and essays</h2>
        <p class="o-standfirst">There&rsquo;s a question I keep coming back to: when the answer comes from a machine, how do we decide whether to believe it? My thesis takes that question to college students. My essays are where I think out loud about AI, online platforms and the companies behind them.</p>
      </div>

      <div class="o-thesis">
        <div>
          <span class="o-essay__no">My master&rsquo;s thesis</span>
          <h3>How undergraduates judge the credibility of generative AI</h3>
        </div>
        <div class="o-thesis__body">
          <p>Look over a student&rsquo;s shoulder these days and there&rsquo;s a good chance ChatGPT, Claude or Gemini is open in another tab. Every answer those tools give asks for a quick judgment: do I trust this? I want to understand how students actually make that call.</p>
          <p>I&rsquo;m working from S. Shyam Sundar&rsquo;s MAIN model, which suggests that the features of a technology can set off mental shortcuts. I&rsquo;m focusing on two. One is about form: whether the way a tool presents information makes it feel more real. The other is about agency: whether knowing a machine, not a person, is doing the answering makes it feel more objective.</p>
          <p>Instead of measuring those shortcuts from a distance, I&rsquo;m sitting down with undergraduates and asking them to talk me through the AI tool they use most &mdash; what makes them believe it, and when they stop.</p>
          <p class="o-thesis__meta">Texas State University, 2026&ndash;27 &middot; Advised by Dr. Heidi Makady</p>
        </div>
      </div>

      <div class="o-subhead" id="essays">
        <h3>Essays</h3>
        <p>I write these on my blog, <a href="https://isaacdigitalmedia0.wordpress.com/" target="_blank" rel="noopener">Hermes Post</a>, usually when a question won&rsquo;t leave me alone.</p>
      </div>
      <div class="o-essays">
      <a class="o-essay" href="https://isaacdigitalmedia0.wordpress.com/2026/02/10/a-reflection-on-corporate-social-responsibility-and-its-communication-restrictions/" target="_blank" rel="noopener">

      </a>
      <a class="o-essay" href="https://isaacdigitalmedia0.wordpress.com/2025/12/28/the-pantheon-show-a-discussion-about-data-centers-and-their-implications/" target="_blank" rel="noopener">

      </a>
      <a class="o-essay" href="https://isaacdigitalmedia0.wordpress.com/2025/11/26/shelves-of-selves-a-look-at-our-online-identities-as-products/" target="_blank" rel="noopener">

        <div class="card-body">
        <div class="page-top"><h2 class="h" style="font-size: 26px">How undergraduates judge the credibility of generative AI</h2></div>
        <div class="ruled">
        <p class="look"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#B03A22" stroke-width="1.5"></circle><circle cx="8" cy="8" r="2.5" fill="#B03A22"></circle></svg><span>On the laptop: the red-pencil notes mark the two cues I study.</span></p>
        <p>Every answer ChatGPT, Claude or Gemini gives asks for a quick judgment: do I trust this? Working from S. Shyam Sundar’s MAIN model, the red-pencil notes mark the two shortcuts I study — <i>form</i>, whether the way a tool presents information makes it feel more real, and <i>agency</i>, whether knowing a machine is answering makes it feel more objective.</p>
        <p>I’m sitting down with undergraduates and asking them to talk me through the AI tool they use most — what makes them believe it, and when they stop.</p>
        <p class="meta">Texas State University, 2026–27 · Advised by Dr. Heidi Makady</p>

        <p>I write these on my blog, <a href="https://isaacdigitalmedia0.wordpress.com/" target="_blank" rel="noopener">Hermes Post</a>, usually when a question won’t leave me alone — about AI, online platforms and the companies behind them.</p>

        <p>A second-year master’s student in digital media communication at Texas State University, after Publishing Studies at KNUST in Ghana. Most days I’m a graduate assistant at the School of Journalism and Mass Communication, helping with AI and Automation for Media Professionals and looking after the school’s web content.</p>
        <p>I also design — the posters and the Save Asaase Yaa illustrations are that side of me. Now I’m applying to PhD programs in communication and advertising.</p>

      const wide = side === 'bl' || k === 7; // the laptop and the overview take the full width
      const aw = wide ? vw * 0.92 : Math.max(vw * 0.6, room * 0.98);
      const ah = (vh - TOP) * (side === 'bl' ? 0.8 : 0.88);
      const s = Math.min(aw / r[2], ah / r[3]);
      let fx = vw * 0.5;
      if (!wide) fx = side === 'r' ? (vw - CW - M) / 2 + 6 : CW + M + (vw - CW - M) / 2 - 6;
      const fy = side === 'bl' ? TOP + (vh - TOP) * 0.42 : TOP + (vh - TOP) * 0.5;
      return { cx: r[0] + r[2] / 2, cy: r[1] + r[3] / 2, s: s, fx: fx, fy: fy };
    };
    const k0 = Math.floor(fe), k1 = Math.min(7, k0 + 1), u = fe - k0;
    const A = frame(k0), B = frame(k1);
    const lerp = (p, q) => p + (q - p) * u;
    const cx = lerp(A.cx, B.cx), cy = lerp(A.cy, B.cy), fx = lerp(A.fx, B.fx), fy = lerp(A.fy, B.fy);
    const s = Math.exp(Math.log(A.s) * (1 - u) + Math.log(B.s) * u) * (1 - 0.22 * Math.sin(Math.PI * u));
    const camera = 'transform:translate(' + (fx - cx * s).toFixed(1) + 'px,' + (fy - cy * s).toFixed(1) + 'px) scale(' + s.toFixed(4) + ');';

    const amt = (k) => (motion ? clamp((raw - k + 0.3) / 0.6) : 1);
    const fmt = (v) => (Math.round(v * 1000) / 1000).toString();
    const a = { a1: fmt(amt(1)), a2: fmt(amt(2)), a3: fmt(amt(3)), a4: fmt(amt(4)), a5: fmt(amt(5)), a6: fmt(amt(6)) };
    const open = fmt(motion ? clamp((raw - 0.3) / 0.5) : (fe >= 1 ? 1 : 0));

    const cs = {};
    const ocs = [];
    for (let k = 0; k < 8; k++) {
      const oc = clamp(1 - Math.abs(fe - k) * 3);
      ocs.push(oc);
      const dy = (1 - oc) * 24 * (fe > k ? -1 : 1);
      const side = PL[k].side;
      let pos, mid = false;
      if (side === 'r') { pos = 'right:' + M + 'px;top:calc(50% + ' + (TOP / 2) + 'px);transform-origin:100% 50%;'; mid = true; }
      else if (side === 'l') { pos = 'left:' + M + 'px;top:calc(50% + ' + (TOP / 2) + 'px);transform-origin:0 50%;'; mid = true; }
      else { pos = 'left:' + M + 'px;bottom:' + M + 'px;transform-origin:0 100%;'; }
      cs['c' + k] = pos + '--z:' + z.toFixed(3) + ';transform:translateY(calc(' + (mid ? '-50% + ' : '') + dy.toFixed(1) + 'px)) scale(' + z.toFixed(3) + ');--dy:' + dy.toFixed(1) + 'px;opacity:' + oc.toFixed(3) + ';visibility:' + (oc < 0.02 ? 'hidden' : 'visible') + ';pointer-events:' + (oc > 0.5 ? 'auto' : 'none') + ';';
    }

    const near = Math.round(fe);
    const pl = PL[near];
    let ld = { x1: 0, y1: 0, x2: 0, y2: 0, op: '0' };
    if (pl.pin && !mobile) {
      const px = fx + (pl.pin[0] - cx) * s, py = fy + (pl.pin[1] - cy) * s;
      let ax, ay;
      if (pl.side === 'r') { ax = vw - M - CW; ay = TOP + (vh - TOP) / 2; }
      else if (pl.side === 'l') { ax = M + CW; ay = TOP + (vh - TOP) / 2; }
      else { ax = M + CW; ay = vh - M - 120; }
      const lo = clamp((ocs[near] - 0.7) / 0.3);
      ld = { x1: px.toFixed(1), y1: py.toFixed(1), x2: ax.toFixed(1), y2: ay.toFixed(1), op: lo.toFixed(3) };
    }

    const labels = ['Cover', 'The thesis', 'Essays', 'Profile', 'Save Asaase Yaa', 'Design', 'Contact', 'The whole desk'];
    const romans = ['', 'I', 'I', 'II', 'III', 'IV', 'V', ''];
    const chapters = labels.map((nm, k) => ({
      href: '#' + this.slugs[k],
      name: 'Chapter ' + k + ': ' + nm,
      label: nm,
      num: String(k),
      cur: k === near ? 'step' : 'false',
      style: k === near ? 'background:#EDE7DA;color:#1E130C;' : 'color:#EDE7DA;border:1px solid rgba(237,231,218,.4);'
    }));

    const cites = {
      APA: 'Adjei, I. S. (2026). Isaac Sarfo Adjei: Communication research, design, digital media [Personal website]. https://isaacsarfoadjei.com',
      MLA: 'Adjei, Isaac Sarfo. Isaac Sarfo Adjei: Communication Research, Design, Digital Media. 2026, isaacsarfoadjei.com.',
      Chicago: 'Adjei, Isaac Sarfo. “Isaac Sarfo Adjei: Communication Research, Design, Digital Media.” Personal website, 2026. https://isaacsarfoadjei.com.'
    };
    const current = this.state.style;
    const base = "min-height: 40px; padding: 0 12px; border: 1.5px solid #1D1A16; font-family: Newsreader, serif; font-size: 15px; cursor: pointer;";
    const styles = ['APA', 'MLA', 'Chicago'].map((label) => ({
      label: label,
      pressed: label === current ? 'true' : 'false',
      btnStyle: base + (label === current ? ' background: #1D1A16; color: #FBF8F1;' : ' background: transparent; color: #1D1A16;'),
      pick: () => this.setState({ style: label, copied: false })
    }));


    const ADV = [
      ['Images/Advocacy%20(2).jpg', 'Before the clearing', 'An excavator standing at the edge of dense forest.', 'An excavator at the edge of forest that has stood for centuries, moments before it is taken down.', 'Fig. 1', 'Advocacy illustration'],
      ['Images/Advocacy%20(1).jpg', 'Raft on a brown river', 'A mining raft floating on a muddy brown river.', "Alluvial mining turns Ghana's waterways to silt. The rafts stay; the water does not come back clear.", 'Fig. 2', 'Advocacy illustration'],
      ['Images/Advocacy%20(4).jpg', 'The boy and the dead river', 'A young boy standing in a river surrounded by dead fish.', 'What mining runoff leaves behind for the communities downstream, and for everything that used to live in the water.', 'Fig. 3', 'Advocacy illustration'],
      ['Images/Advocacy%20(3).jpg', 'Where do you get your gold from?', 'Many arms wearing gold jewellery arranged to form a skull.', 'Arms in gold jewellery arranged into a skull — the true cost of the metal, carried by the person wearing it.', 'Fig. 4', 'Cover illustration']
    ];
    const DES = [
      ['Images/ACE%2015.jpg', 'Accra Zoo', 'Poster advertising the Accra Zoo.', 'Visitor campaign poster for the Accra Zoo.', 'Plate I', 'Visitor campaign'],
      ['Images/Grace%20(1).jpg', 'Grace', 'Ballet performance poster featuring a ballerina figurine.', 'Performance poster for a ballet production, built around a single figurine and a lot of quiet space.', 'Plate II', 'Performance poster'],
      ['Images/HYBRID%20(1).jpg', 'Hybrid generator', 'Product advertisement for a hybrid generator set in a forest.', 'Product advertisement placing a hybrid generator in a forest setting, leaning on the quiet-running claim.', 'Plate III', 'Product advertising'],
      ['Images/sea.jpg', 'Seafood house', 'Poster design for a seafood restaurant.', 'Restaurant poster built around the catch rather than the plate.', 'Plate IV', 'Restaurant poster'],
      ['Images/Cline.jpg', 'Cline', 'Brand design advertising an antique padded chair.', 'Brand design for a sale of antique padded chairs — furniture treated as portraiture.', 'Plate V', 'Brand design'],
      ['Images/ACE%2011%20(1).jpg', 'Shelter and pet store', 'Poster design for a dog shelter and pet store.', 'Adoption poster for a dog shelter and pet store.', 'Plate VI', 'Adoption poster'],
      ['Images/Ace%206%20(1).jpg', 'Laptop store', 'Poster design for a laptop store.', 'Retail poster for a laptop store.', 'Plate VII', 'Retail poster'],
      ['Images/SPJ%20A4.jpg', 'SPJ, Texas State', 'Poster for the Texas State SPJ student chapter.', 'Recruitment poster for the Texas State student chapter of the Society of Professional Journalists.', 'Plate VIII', 'Chapter recruitment'],
      ['Images/poster.jpg', 'Mass Communication Week', 'Poster for SJMC Mass Communication Week.', "Event poster for the School of Journalism and Mass Communication's annual Mass Communication Week.", 'Plate IX', 'Event poster, SJMC']
    ];
    const SETS = { adv: ADV, des: DES };
    const mk = (g) => SETS[g].map((r, n) => ({
      src: r[0], title: r[1], alt: r[2], fig: r[4], kind: r[5],
      cls: 'o-plate' + (g === 'des' && n === 0 ? ' o-plate--lead' : ''),
      open: () => this.setState({ vg: g, vi: n })
    }));
    const vg = this.state.vg;
    const vset = vg ? SETS[vg] : null;
    const vr = vset ? vset[((this.state.vi % vset.length) + vset.length) % vset.length] : null;
    const viewerVals = vr ? { open: true, src: vr[0], title: vr[1], alt: vr[2], note: vr[3] } : { open: false, src: '', title: '', alt: '', note: '' };
    const collapsed = this.state.collapsed;
    return {
      rootClass: motion ? 'moving' : 'still',
      reader: reader,
      tourOn: !reader,
      readerStr: reader ? 'true' : 'false',
      readerLabel: reader ? 'Back to the desk' : 'Read as a page',
      toggleReader: () => {
        this.setState({ reader: !this.state.reader, vg: null, settled: false });
        try { window.scrollTo(0, 0); } catch (e) {}
      },
      pausedStr: paused ? 'true' : 'false',
      pauseLabel: paused ? 'Motion off' : 'Motion on',
      togglePause: () => this.setState({ paused: !this.state.paused }),
      cardClass: collapsed ? 'collapsed' : '',
      cardOpen: collapsed ? 'false' : 'true',
      collapseLabel: collapsed ? 'Show ▴' : 'Hide ▾',
      toggleCard: () => this.setState({ collapsed: !this.state.collapsed }),
      touchStart: (e) => {
        try { const p = e.touches[0]; this.touch = { x: p.clientX, y: p.clientY }; } catch (err) { this.touch = null; }
      },
      touchEnd: (e) => {
        try {
          if (!this.touch) return;
          const p = e.changedTouches[0];
          const dx = p.clientX - this.touch.x, dy = p.clientY - this.touch.y;
          this.touch = null;
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) this.goTo(near + (dx < 0 ? 1 : -1));
        } catch (err) {}
      },
      navCls: this.state.settled ? 'o-settled' : '',
      advPlates: mk('adv'),
      desPlates: mk('des'),
      vw: viewerVals,
      vwClose: () => this.setState({ vg: null }),
      vwBackdrop: (e) => { try { if (e.target === e.currentTarget) this.setState({ vg: null }); } catch (err) {} },
      vwPrev: () => this.setState({ vi: this.state.vi - 1 }),
      vwNext: () => this.setState({ vi: this.state.vi + 1 }),
      keyRows: this.keyRows,
      camera: camera,
      a: a,
      open: open,
      cs: cs,
      ld: ld,
      cueOp: clamp(1 - fe * 3).toFixed(3),
      chapters: chapters,
      chapLabel: (romans[near] ? romans[near] + ' · ' : '') + labels[near],
      styles: styles,
      citation: cites[current],
      copyLabel: this.state.copied ? 'Copied ✓' : 'Copy',
      copy: () => {
        try {
          navigator.clipboard.writeText(cites[current]).then(() => this.setState({ copied: true }), () => {});
        } catch (e) {}
      }
    };
  }
}
window.__mountDesk(Component, { motion: true });
